name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin and marketplace
        # The marketplace check is not strict: slice-board carries no version on purpose (every commit is an update).
        run: claude plugin validate . && claude plugin validate --strict plugins/vibe-rebuild && claude plugin validate --strict plugins/vibe-coding
      - name: Validate skill against the Agent Skills spec
        run: |
          pip install "skills-ref @ git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"
          skills-ref validate plugins/vibe-rebuild/skills/vibe-rebuild
          skills-ref validate plugins/vibe-coding/skills/vibe-coding
      - name: Check scripts
        run: |
          python -m py_compile plugins/vibe-rebuild/skills/vibe-rebuild/scripts/*.py plugins/vibe-coding/skills/vibe-coding/scripts/*.py plugins/vibe-rebuild/skills/vibe-rebuild/assets/*.py tests/*.py
          python plugins/vibe-rebuild/skills/vibe-rebuild/scripts/inventory.py . > /dev/null
          printf '%s' '[{"nr":"00","slug":"scaffold","name":"Scaffold","goal":"g","prd":"p","deps":"-","scope":["a"],"parity":"x","non_goals":"n"}]' > /tmp/s.json
          python plugins/vibe-rebuild/skills/vibe-rebuild/scripts/render_slices.py /tmp/s.json /tmp/slices
          test -f /tmp/slices/00-scaffold.md
          python plugins/vibe-rebuild/skills/vibe-rebuild/scripts/render_slices.py /tmp/s.json /tmp/slices-de --lang de
          grep -q "Hängt ab von" /tmp/slices-de/00-scaffold.md
          printf '%s' '[{"nr":"07","slug":"message-bars","name":"Message bars","goal":"g","round":"R01","source":"R01 - F-03","deps":"-","scope":["a"],"mirror":["src/a.ts:1"],"not_building":["b"],"acceptance":["Given a When b Then c"],"manual":["Click a"],"non_goals":"n"}]' > /tmp/c.json
          python plugins/vibe-coding/skills/vibe-coding/scripts/render_slices.py /tmp/c.json /tmp/coding-slices
          test -f /tmp/coding-slices/07-message-bars.md
          python plugins/vibe-coding/skills/vibe-coding/scripts/render_slices.py /tmp/c.json /tmp/coding-slices-de --lang de
          grep -q "Muster übernehmen" /tmp/coding-slices-de/07-message-bars.md
          printf '%s' '[{"nr":"03","slug":"search","name":"Search","goal":"g","prd":"p","deps":"00","acs":["AC-03","AC-07"],"scope":["a"],"parity":"x","non_goals":"n"}]' > /tmp/g.json
          python plugins/vibe-rebuild/skills/vibe-rebuild/scripts/render_slices.py /tmp/g.json /tmp/goal-slices
          grep -q "Goal criteria:\*\* AC-03, AC-07" /tmp/goal-slices/03-search.md
          grep -q "evidence.py check 03" /tmp/goal-slices/03-search.md
          python tests/render_slices_test.py
          python tests/goal_evidence_test.py
          python tests/markers_test.py
      - name: Check loop scripts
        run: |
          bash -n plugins/vibe-rebuild/skills/vibe-rebuild/assets/rebuild-loop.sh
          pwsh -NoProfile -Command "\$null = [scriptblock]::Create((Get-Content -Raw plugins/vibe-rebuild/skills/vibe-rebuild/assets/rebuild-loop.ps1))"
          bash -n plugins/vibe-coding/skills/vibe-coding/assets/slice-loop.sh
          pwsh -NoProfile -Command "\$null = [scriptblock]::Create((Get-Content -Raw plugins/vibe-coding/skills/vibe-coding/assets/slice-loop.ps1))"
          python tests/loop_test.py
